name: CI

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Select a preset model or choose custom"
        required: true
        default: "K2P"
        type: choice
        options:
          - K2P
          - K2P_nano
          - MI-3C
          - custom
      custom_target:
        description: "Custom model name from trunk/configs/templates, used when target=custom"
        required: false
        type: string
      upload_to_release:
        description: "Upload build output to GitHub Releases"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag to create/update, leave blank to auto-generate"
        required: false
        type: string
      debug_enabled:
        description: "Run the build with tmate debugging enabled"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ github.event.inputs.target }}
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Resolve build target
        run: |
          set -euo pipefail

          if [ "${{ github.event.inputs.target }}" = "custom" ]; then
            TARGET_NAME="${{ github.event.inputs.custom_target }}"
          else
            TARGET_NAME="${{ github.event.inputs.target }}"
          fi

          if [ -z "${TARGET_NAME}" ]; then
            echo "Target name is empty."
            exit 1
          fi

          CONFIG_FILE="trunk/configs/templates/${TARGET_NAME}.config"
          if [ ! -f "${CONFIG_FILE}" ]; then
            echo "Config not found: ${CONFIG_FILE}"
            exit 1
          fi

          CONFIG_PRODUCT="$(sed -n 's/^CONFIG_PRODUCT=//p' "${CONFIG_FILE}" | head -n1)"
          case "${CONFIG_PRODUCT}" in
            MT7620)
              BUILD_VARIANT="mt7620"
              ;;
            MT7621)
              BUILD_VARIANT="mt7621"
              ;;
            MT7628)
              BUILD_VARIANT="mt7628"
              ;;
            *)
              echo "Unsupported CONFIG_PRODUCT '${CONFIG_PRODUCT}' in ${CONFIG_FILE}"
              exit 1
              ;;
          esac

          SAFE_TARGET="$(printf '%s' "${TARGET_NAME}" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9._-' '-')"
          IMAGES_DIR="${GITHUB_WORKSPACE}/artifacts/${SAFE_TARGET}"
          BUILD_IMAGE="padavan-builder:${GITHUB_RUN_ID}-${SAFE_TARGET}"

          if [ "${{ github.event.inputs.upload_to_release }}" = "true" ]; then
            RELEASE_TAG_INPUT="${{ github.event.inputs.release_tag }}"
            if [ -n "${RELEASE_TAG_INPUT}" ]; then
              RELEASE_TAG="${RELEASE_TAG_INPUT}"
            else
              RELEASE_TAG="manual-${SAFE_TARGET}-${GITHUB_RUN_NUMBER}"
            fi
            echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"
          fi

          echo "TARGET_NAME=${TARGET_NAME}" >> "${GITHUB_ENV}"
          echo "BUILD_VARIANT=${BUILD_VARIANT}" >> "${GITHUB_ENV}"
          echo "IMAGES_DIR=${IMAGES_DIR}" >> "${GITHUB_ENV}"
          echo "BUILD_IMAGE=${BUILD_IMAGE}" >> "${GITHUB_ENV}"

      - name: Build container image
        run: docker build --pull -t "${BUILD_IMAGE}" .

      - name: Prepare artifact directory
        run: mkdir -p "${IMAGES_DIR}"

      - name: Run shellcheck
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workdir" \
            -w /workdir \
            "${BUILD_IMAGE}" \
            sh ./trunk/tools/shellcheck.sh

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event.inputs.debug_enabled == 'true' }}
        with:
          limit-access-to-actor: true

      - name: Build firmware
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workdir" \
            -v "${IMAGES_DIR}:/opt/images" \
            -w /workdir/trunk \
            -e HOME=/tmp \
            -e TARGET_NAME="${TARGET_NAME}" \
            "${BUILD_IMAGE}" \
            bash -lc '
              set -euo pipefail
              mkdir -p /opt/images
              ln -sfn /opt/rt-n56u/toolchain-mipsel/toolchain-3.4.x /workdir/toolchain-mipsel/toolchain-3.4.x
              fakeroot ./build_firmware_ci "${TARGET_NAME}"
              cp -f images/*.trx /opt/images/"${TARGET_NAME}".trx
            '

      - name: Create archive
        run: |
          set -euo pipefail
          ls -lh "${IMAGES_DIR}"
          GIT_VERSION="$(git rev-parse --short=7 HEAD 2>/dev/null || true)"
          if [ -n "${GIT_VERSION}" ]; then
            IMAGE_NAME="images_${TARGET_NAME}_${GIT_VERSION}"
          else
            IMAGE_NAME="images_${TARGET_NAME}"
          fi
          docker run --rm \
            -v "${IMAGES_DIR}:/opt/images" \
            -e IMAGE_NAME="${IMAGE_NAME}" \
            "${BUILD_IMAGE}" \
            bash -lc '
              set -euo pipefail
              7z a -mx=9 "/opt/images/${IMAGE_NAME}.7z" /opt/images/*.trx
              md5sum /opt/images/*.trx | tee /opt/images/md5sum.txt
            '
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "${GITHUB_ENV}"

      - name: Upload images to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}
          path: |
            ${{ env.IMAGES_DIR }}/*.7z
            ${{ env.IMAGES_DIR }}/*.trx
            ${{ env.IMAGES_DIR }}/md5sum.txt

      - name: Upload images to Releases
        if: ${{ github.event.inputs.upload_to_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            ${{ env.IMAGES_DIR }}/*.7z
            ${{ env.IMAGES_DIR }}/*.trx
            ${{ env.IMAGES_DIR }}/md5sum.txt
