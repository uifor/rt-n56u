name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: "Run the build with tmate debugging enabled"
        required: false
        default: "no"
  release:
    types: [published]

jobs:
  build:
    name: ${{ matrix.build_variant }}
    runs-on: ubuntu-22.04
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
    env:
      BUILD_VARIANT: ${{ matrix.build_variant }}
      TARGETS: ${{ matrix.targets }}
      IMAGES_DIR: ${{ github.workspace }}/artifacts/${{ matrix.build_variant }}
      BUILD_IMAGE: padavan-builder:${{ github.run_id }}-${{ matrix.build_variant }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_variant: "mt7628"
            targets: "MI-3C"
          - build_variant: "mt7621"
            targets: "K2P_nano K2P"

    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build --pull -t "${BUILD_IMAGE}" .

      - name: Prepare artifact directory
        run: mkdir -p "${IMAGES_DIR}"

      - name: Run shellcheck
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workdir" \
            -w /workdir \
            "${BUILD_IMAGE}" \
            sh ./trunk/tools/shellcheck.sh

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'yes' }}
        with:
          limit-access-to-actor: true

      - name: Build firmware
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workdir" \
            -v "${IMAGES_DIR}:/opt/images" \
            -w /workdir/trunk \
            -e HOME=/tmp \
            -e TARGETS="${TARGETS}" \
            "${BUILD_IMAGE}" \
            bash -lc '
              set -euo pipefail
              mkdir -p /opt/images
              for m in ${TARGETS}; do
                fakeroot ./build_firmware_ci "${m}"
                cp -f images/*.trx /opt/images/"${m}".trx
                ./clear_tree_simple >/dev/null 2>&1
              done
            '

      - name: Create archive
        if: ${{ github.event_name != 'release' && success() }}
        run: |
          set -euo pipefail
          ls -lh "${IMAGES_DIR}"
          GIT_VERSION="$(git rev-parse --short=7 HEAD 2>/dev/null || true)"
          if [ -n "${GIT_VERSION}" ]; then
            IMAGE_NAME="images_${BUILD_VARIANT}_${GIT_VERSION}"
          else
            IMAGE_NAME="images_${BUILD_VARIANT}"
          fi
          docker run --rm \
            -v "${IMAGES_DIR}:/opt/images" \
            -e IMAGE_NAME="${IMAGE_NAME}" \
            "${BUILD_IMAGE}" \
            bash -lc '
              set -euo pipefail
              7z a -mx=9 "/opt/images/${IMAGE_NAME}.7z" /opt/images/*.trx
              md5sum /opt/images/*.trx | tee /opt/images/md5sum.txt
            '
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "${GITHUB_ENV}"

      - name: Upload images to Artifact
        if: ${{ github.event_name != 'release' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}
          path: |
            ${{ env.IMAGES_DIR }}/*.7z
            ${{ env.IMAGES_DIR }}/md5sum.txt

      - name: Upload images to Releases
        if: ${{ github.event_name == 'release' && success() }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.IMAGES_DIR }}/*.trx
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
